spring:
  application:
    name: flight-trip-manager
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    clean-disabled: true
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: com.flighttripmanager.shared.infrastructure.logging.SafeStructuredLogFormatter
      file: com.flighttripmanager.shared.infrastructure.logging.SafeStructuredLogFormatter
