services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: card7
      POSTGRES_USER: card7
      POSTGRES_PASSWORD: local_validation_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card7 -d card7"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: eclipse-temurin:17-jre-jammy
    user: "10001:10001"
    working_dir: /app
    command: ["java", "-jar", "/app/app.jar"]
    volumes:
      - ../../target/flight-trip-manager-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
    environment:
      SPRING_PROFILES_ACTIVE: local
      FLIGHT_SEARCH_MODE: disabled
      DB_URL: jdbc:postgresql://postgres:5432/card7
      DB_USERNAME: card7
      DB_PASSWORD: local_validation_only
    ports:
      - "127.0.0.1:18087:8080"
    depends_on:
      postgres:
        condition: service_healthy
